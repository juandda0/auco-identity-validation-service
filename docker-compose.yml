name: auco-validation

services:
  mongo:
    image: mongo:7.0
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:2.6.1
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-inMemory"]
    ports:
      - "${DYNAMO_PORT:-8000}:8000"

  api:
    build: ./api
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: auco
      DYNAMO_ENDPOINT: http://dynamodb:8000
      DYNAMO_REGION: us-east-1
      DYNAMO_TABLE: audit_events
      COUNTRIES_API_URL: https://restcountries.com/v3.1
      COUNTRIES_TIMEOUT_MS: 3000
      CORS_ORIGIN: http://localhost:${WEB_PORT:-3001}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      mongo:
        condition: service_healthy
      dynamodb:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mongo-data:
